<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — Nosotros Finanzas</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f9f9f7;
        color: #0b0b0b;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 360px; }
      .icon { font-size: 48px; margin-bottom: 12px; }
      h1 { font-size: 1.1rem; margin: 0 0 8px; }
      p { color: #52514e; font-size: 0.9rem; }
      button {
        margin-top: 16px;
        background: #2a78d6;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">📡</div>
      <h1>Sin conexión a internet</h1>
      <p>Nosotros Finanzas necesita conexión para leer y guardar los movimientos. Revisa tu red e intenta de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
